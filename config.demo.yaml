# Demo trên TEN VAD testset (xem README > Chạy thử nhanh). Không cần dữ liệu của bạn.
data:
  manifest: data/demo/manifest.csv
  gt_bin: 0.5
output_dir: out_demo
num_threads: 1

models:
  - name: silero
    type: silero
    model_path: models/silero_vad.onnx
  - name: webrtc_m1
    type: webrtc
    mode: 1
  - name: webrtc_m3
    type: webrtc
    mode: 3
  - name: ten
    type: ten
  - name: firered
    type: firered
    model_dir: models/firered
  - name: firered_stream
    type: firered
    model_dir: models/firered
    onnx: fireredvad_stream_vad.onnx
  - name: yamnet
    type: yamnet
    model_path: models/yamnet_vad.tflite
    enabled: false          # bật khi đã copy model của bạn vào models/

  # MÔ PHỎNG YAMNet (0.96 s / 0.08 s) từ prob FireRed - xem scripts/simulate_yamnet.py.
  # Dùng để thử `python -m vadcmp tune --model yamnet_sim`, KHÔNG phải kết quả YAMNet thật.
  - name: yamnet_sim
    type: precomputed
    path_pattern: data/demo/yamnet_sim/{stem}.txt
    threshold: 0.6026          # post-processing = mặc định (rules: pad 0.10/0.12 -> merge 0.5 -> drop 0.32)
